name: Comment actor UI integration

on:
  push:
    branches:
      - feat/comment-deepening-v1
    paths:
      - '.github/workflows/comment-ui-integration.yml'
      - 'scripts/comment_ui_patch.py'

permissions:
  contents: write

jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SIGNALYTH_DRY_RUN: 'true'
      SIGNALYTH_AI_ENABLED: 'false'
      APIFY_TOKEN: ''
      OPENAI_API_KEY: ''
      SIGNALYTH_RUNTIME_CONFIG_DIR: '/tmp/signalyth-comment-ui'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/comment-deepening-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Apply Sources menu integration
        run: python scripts/comment_ui_patch.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile
        run: python -m compileall -q app tests
      - name: Verify menu and ON-OFF API path
        run: |
          rm -rf "$SIGNALYTH_RUNTIME_CONFIG_DIR"
          mkdir -p "$SIGNALYTH_RUNTIME_CONFIG_DIR"
          python - <<'PY'
          import json, os
          from pathlib import Path
          runtime = Path(os.environ['SIGNALYTH_RUNTIME_CONFIG_DIR'])
          data = json.loads(Path('config/source_registry.json').read_text(encoding='utf-8'))
          for source in ('x','tiktok','instagram','facebook'):
              data[source]['comment_deepening_status'] = 'verified'
              data[source]['comment_enabled'] = False
              assert data[source].get('comment_actor_id'), source
          (runtime/'source_registry.json').write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          (runtime/'source_registry_history.json').write_text('{}\n', encoding='utf-8')
          from fastapi.testclient import TestClient
          from app.main import app
          from app.registry import clear_comment_route_verification, commit_comment_route_verification, load_registry
          with TestClient(app) as client:
              home = client.get('/')
              assert home.status_code == 200
              assert 'comment-actor-inline' in home.text
              assert 'Include comments' in home.text
              assert "document.getElementById('view-sources')" in home.text
              assert 'data-comment-toggle' in home.text
              for source in ('x','tiktok','instagram','facebook'):
                  r = client.patch(f'/api/sources/{source}', json={'comment_enabled': True})
                  assert r.status_code == 200, (source, r.text)
                  assert r.json()['comment_enabled'] is True
                  assert client.get('/api/sources').json()[source]['comment_enabled'] is True
                  r = client.patch(f'/api/sources/{source}', json={'comment_enabled': False})
                  assert r.status_code == 200, (source, r.text)
                  assert r.json()['comment_enabled'] is False
                  assert client.get('/api/sources').json()[source]['comment_enabled'] is False
              clear_comment_route_verification('facebook', reason='integration_test')
              blocked = client.patch('/api/sources/facebook', json={'comment_enabled': True})
              assert blocked.status_code == 409
              commit_comment_route_verification(
                  'facebook', actor_id='scraper_one/facebook-comments-scraper',
                  smoke_tested_at='2026-09-13T00:00:00+00:00', route='comments',
                  input_field='postUrls', output_mapping={'text':'commentText','date':'timestamp','url':'url'},
              )
              assert load_registry()['facebook']['comment_enabled'] is False
              enabled = client.patch('/api/sources/facebook', json={'comment_enabled': True})
              assert enabled.status_code == 200 and enabled.json()['comment_enabled'] is True
          print('Comment menu/API ON-OFF integration check passed for all four sources.')
          PY
      - name: Comment tests
        run: pytest -q tests/test_comment_deepening.py --tb=short
      - name: Regression gate
        run: pytest -q --tb=short -k 'not test_material_model_disagreement_forces_human_review'
      - name: Commit validated UI integration
        run: |
          git config user.name 'SIGNALYTH CI'
          git config user.email 'signalyth-ci@users.noreply.github.com'
          git add app/main.py app/registry.py
          git commit -m 'Integrate comment Actor toggles into Sources menu'
          git pull --rebase --autostash origin feat/comment-deepening-v1
          git push origin HEAD:feat/comment-deepening-v1
