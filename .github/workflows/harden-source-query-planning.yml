name: Harden source query planning

on:
  push:
    paths:
      - '.github/workflows/harden-source-query-planning.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch source-aware planning
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/services/query_planner.py')
          text = path.read_text(encoding='utf-8')

          text = text.replace('from datetime import timedelta\n', 'from datetime import date, timedelta\n', 1)

          anchor = 'def news_queries_for_capacity(draft: AnalysisDraft, queries: list[str], target: int) -> list[str]:\n'
          helpers = '''def _prioritized_source_queries(draft: AnalysisDraft, queries: list[str], limit: int) -> list[str]:
              """Put explicit user focus first on Actors with limited query slots."""
              primary = canonical_topic(str(draft.topic or "").strip(), str(draft.market or ""))
              primary_fold = primary.casefold()
              focus_terms = uniq([*draft.keywords, *draft.additional_context])
              focus_terms = [str(x).strip() for x in focus_terms if str(x).strip() and str(x).strip().casefold() != primary_fold and str(x).strip().casefold() not in primary_fold]
              anchored = [f"{primary} {term}" for term in focus_terms]
              ordered = ([anchored[0]] if anchored else []) + [primary] + anchored[1:] + list(queries)
              return uniq(ordered)[:max(1, int(limit))]

          def _facebook_safe_query(value: str) -> str:
              """Facebook Posts Search query is capped at 100 characters."""
              value = re.sub(r"\s+", " ", str(value or "")).strip()
              if len(value) <= 100:
                  return value
              clipped = value[:100].rstrip()
              return clipped.rsplit(" ", 1)[0].rstrip() if " " in clipped else clipped

          def _facebook_queries(draft: AnalysisDraft, queries: list[str], limit: int = 4) -> list[str]:
              return uniq([_facebook_safe_query(q) for q in _prioritized_source_queries(draft, queries, limit) if q])[:limit]

          def _tiktok_date_range(draft: AnalysisDraft, today: date | None = None) -> str:
              today = today or date.today()
              if draft.date_from > today:
                  return "ALL_TIME"
              age = max(0, (today - draft.date_from).days)
              if age <= 1:
                  return "YESTERDAY"
              if draft.date_from.isocalendar()[:2] == today.isocalendar()[:2]:
                  return "THIS_WEEK"
              if draft.date_from.year == today.year and draft.date_from.month == today.month:
                  return "THIS_MONTH"
              if age <= 90:
                  return "LAST_THREE_MONTHS"
              if age <= 180:
                  return "LAST_SIX_MONTHS"
              return "ALL_TIME"

          def _youtube_upload_date(draft: AnalysisDraft, today: date | None = None) -> str:
              today = today or date.today()
              if draft.date_from > today:
                  return "all"
              age = max(0, (today - draft.date_from).days)
              if age <= 1:
                  return "t"
              if age <= 7:
                  return "w"
              if age <= 31:
                  return "m"
              if age <= 366:
                  return "y"
              return "all"

          '''
          if anchor not in text:
              raise SystemExit('news query anchor not found')
          text = text.replace(anchor, helpers + anchor, 1)

          replacements = [
              (
                  '    elif source == "tiktok":\n        batches = batched(queries[:8] or [draft.topic], safe_batch)\n',
                  '    elif source == "tiktok":\n        source_queries = _prioritized_source_queries(draft, queries, 8)\n        batches = batched(source_queries or [draft.topic], safe_batch)\n'
              ),
              ('                   "dateRange": "ALL_TIME", "sortType": "RELEVANCE"}\n', '                   "dateRange": _tiktok_date_range(draft), "sortType": "RELEVANCE"}\n'),
              ('    elif source == "facebook":\n        q = queries[:4] or [draft.topic]\n', '    elif source == "facebook":\n        q = _facebook_queries(draft, queries, 4) or [_facebook_safe_query(draft.topic)]\n'),
              (
                  '    elif source == "youtube":\n        batches = batched(queries[:10] or [draft.topic], safe_batch)\n',
                  '    elif source == "youtube":\n        source_queries = _prioritized_source_queries(draft, queries, 10)\n        batches = batched(source_queries or [draft.topic], safe_batch)\n'
              ),
              ('                   "hl": "el" if draft.market.casefold()=="greece" else "en", "uploadDate": "all", "sort": "r", "maxItems": max(1, share)}\n', '                   "hl": "el" if draft.market.casefold()=="greece" else "en", "uploadDate": _youtube_upload_date(draft), "sort": "r", "maxItems": max(1, share)}\n'),
              ('    elif source == "news":\n        news_queries = news_queries_for_capacity(draft, queries, target)\n', '    elif source == "news":\n        news_queries = news_queries_for_capacity(draft, _prioritized_source_queries(draft, queries, 8), target)\n'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit('expected planner block not found: ' + old.splitlines()[0])
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Run no-network Actor payload tests
        run: |
          python -m pip install -q "pydantic>=2.13,<3" "pydantic-settings>=2.12,<3"
          python -m compileall -q app
          python - <<'PY'
          from datetime import date, timedelta
          from app.models import AnalysisDraft
          from app.services.query_planner import build_collection_plan

          today = date.today()
          draft = AnalysisDraft(
              client='TEST', topic='Αλέξης Τσίπρας', market='Greece',
              date_from=today - timedelta(days=6), date_to=today,
              keywords=['ΔΕΘ', 'Θεσσαλονίκη', 'οικονομία'],
              sources=['x','tiktok','instagram','facebook','youtube','news'],
              sample_mode='automatic', sample_target=300, comments=False,
              max_budget_usd=2.0, smart_search=True, report_language='Ελληνικά',
          )
          plan = build_collection_plan(draft)
          by = {p.source: p for p in plan.sources}
          assert set(by) == {'x','tiktok','instagram','facebook','youtube','news'}

          x = by['x'].subruns[0].input
          assert isinstance(x['searchTerms'], list) and x['searchTerms'] and x['queryType'] == 'Latest'
          assert x['since'].endswith('_UTC') and x['until'].endswith('_UTC')

          tt = by['tiktok'].subruns[0].input
          assert isinstance(tt['search'], list) and tt['search'] and tt['location'] == 'GR'
          assert tt['dateRange'] != 'ALL_TIME' and tt['sortType'] == 'RELEVANCE'

          ig = by['instagram'].subruns[0].input
          assert isinstance(ig['directUrls'], list) and ig['directUrls']
          assert ig['resultsType'] in {'posts','reels'} and ig['onlyPostsNewerThan']

          fb = by['facebook']
          fb_queries = [s.input['query'] for s in fb.subruns]
          assert any('ΔΕΘ' in q for q in fb_queries), fb_queries
          assert any('Αλέξης Τσίπρας' in q for q in fb_queries), fb_queries
          assert all(isinstance(q, str) and 1 <= len(q) <= 100 for q in fb_queries), fb_queries
          assert all(s.input['searchType'] == 'latest' and s.input['startDate'] and s.input['endDate'] for s in fb.subruns)

          yt = by['youtube'].subruns[0].input
          assert isinstance(yt['keywords'], list) and yt['keywords']
          assert yt['gl'] == 'gr' and yt['hl'] == 'el' and yt['uploadDate'] == 'w' and yt['sort'] == 'r'

          news = by['news'].subruns[0].input
          assert isinstance(news['queries'], list) and news['queries']
          assert news['country'] == 'GR' and news['language'] == 'el'
          assert news['fromDate'] and news['toDate'] and news['resolveUrls'] is True

          print('PASS: all six built-in Actor payload shapes and focused query ordering validated without paid calls')
          print('Facebook queries:', fb_queries)
          PY

      - name: Commit tested planner patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/harden-source-query-planning.yml
          git add app/services/query_planner.py
          git commit -m "Harden source-specific query planning"
          git push
