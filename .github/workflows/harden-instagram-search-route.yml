name: Harden Instagram search route

on:
  push:
    paths:
      - '.github/workflows/harden-instagram-search-route.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch Instagram search fields
        run: |
          python -c 'from pathlib import Path; p=Path("app/services/query_planner.py"); t=p.read_text(encoding="utf-8"); old="        for i, ((tag, mode), share) in enumerate(zip(jobs, shares)):\n            inp = {\"directUrls\": [f\"https://www.instagram.com/explore/tags/{tag.lower()}/\"], \"resultsType\": mode,\n                   \"resultsLimit\": max(1, share), \"onlyPostsNewerThan\": draft.date_from.isoformat(), \"addParentData\": True}\n"; new="        for i, ((tag, mode), share) in enumerate(zip(jobs, shares)):\n            inp = {\"search\": f\"#{tag}\", \"searchType\": \"hashtag\", \"searchLimit\": 1, \"resultsType\": mode,\n                   \"resultsLimit\": max(1, share), \"onlyPostsNewerThan\": draft.date_from.isoformat(), \"addParentData\": True}\n"; assert old in t; p.write_text(t.replace(old,new,1), encoding="utf-8")'

      - name: Run no-network Instagram input test
        run: |
          python -m pip install -q "pydantic>=2.13,<3" "pydantic-settings>=2.12,<3"
          python -m compileall -q app
          python -c 'from datetime import date,timedelta; from app.models import AnalysisDraft; from app.services.query_planner import build_collection_plan; d=AnalysisDraft(client="TEST",topic="Αλέξης Τσίπρας",market="Greece",date_from=date.today()-timedelta(days=6),date_to=date.today(),keywords=["ΔΕΘ","Θεσσαλονίκη"],sources=["instagram"],sample_mode="automatic",sample_target=40,comments=False,max_budget_usd=1.0,smart_search=True,report_language="Ελληνικά"); p=build_collection_plan(d); xs=[s.input for s in p.sources[0].subruns]; assert xs and all(isinstance(x.get("search"),str) and x["search"].startswith("#") and x.get("searchType")=="hashtag" and x.get("searchLimit")==1 and x.get("resultsType") in {"posts","reels"} and x.get("onlyPostsNewerThan")==d.date_from.isoformat() and "directUrls" not in x for x in xs); print("PASS Instagram search schema")'

      - name: Commit tested Instagram route
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/harden-instagram-search-route.yml
          git add app/services/query_planner.py
          git commit -m "Use Instagram search fields for hashtag discovery"
          git push
