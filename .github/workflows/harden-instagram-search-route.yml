name: Harden Instagram search route

on:
  push:
    paths:
      - '.github/workflows/harden-instagram-search-route.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Use Instagram Actor search fields for hashtag discovery
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/services/query_planner.py')
          text = path.read_text(encoding='utf-8')
          old = '''        for i, ((tag, mode), share) in enumerate(zip(jobs, shares)):
            inp = {"directUrls": [f"https://www.instagram.com/explore/tags/{tag.lower()}/"], "resultsType": mode,
                   "resultsLimit": max(1, share), "onlyPostsNewerThan": draft.date_from.isoformat(), "addParentData": True}
'''
          new = '''        for i, ((tag, mode), share) in enumerate(zip(jobs, shares)):
            inp = {"search": f"#{tag}", "searchType": "hashtag", "searchLimit": 1, "resultsType": mode,
                   "resultsLimit": max(1, share), "onlyPostsNewerThan": draft.date_from.isoformat(), "addParentData": True}
'''
          if old not in text:
              raise SystemExit('Expected Instagram hashtag route not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Run no-network Instagram input test
        run: |
          python -m pip install -q "pydantic>=2.13,<3" "pydantic-settings>=2.12,<3"
          python -m compileall -q app
          python - <<'PY'
          from datetime import date, timedelta
          from app.models import AnalysisDraft
          from app.services.query_planner import build_collection_plan
          today = date.today()
          draft = AnalysisDraft(
              client='TEST', topic='Αλέξης Τσίπρας', market='Greece',
              date_from=today - timedelta(days=6), date_to=today,
              keywords=['ΔΕΘ','Θεσσαλονίκη'], sources=['instagram'],
              sample_mode='automatic', sample_target=40, comments=False,
              max_budget_usd=1.0, smart_search=True, report_language='Ελληνικά',
          )
          plan = build_collection_plan(draft)
          ig = plan.sources[0]
          assert ig.source == 'instagram' and ig.subruns
          for subrun in ig.subruns:
              inp = subrun.input
              assert isinstance(inp.get('search'), str) and inp['search'].startswith('#')
              assert inp.get('searchType') == 'hashtag'
              assert inp.get('searchLimit') == 1
              assert inp.get('resultsType') in {'posts','reels'}
              assert isinstance(inp.get('resultsLimit'), int) and inp['resultsLimit'] >= 1
              assert inp.get('onlyPostsNewerThan') == draft.date_from.isoformat()
              assert inp.get('addParentData') is True
              assert 'directUrls' not in inp
          print('PASS: Instagram uses explicit search/searchType hashtag fields with date and result limits')
          PY

      - name: Commit tested Instagram route
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/harden-instagram-search-route.yml
          git add app/services/query_planner.py
          git commit -m "Use Instagram search fields for hashtag discovery"
          git push
