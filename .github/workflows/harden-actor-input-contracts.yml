name: Harden Actor input contracts

on:
  push:
    paths:
      - '.github/workflows/harden-actor-input-contracts.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch source-aware query planning and add hard Actor contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/services/query_planner.py')
          text = path.read_text(encoding='utf-8')

          old = 'from datetime import timedelta\n'
          new = 'from datetime import date, timedelta\n'
          assert old in text
          text = text.replace(old, new, 1)

          old = 'from app.services.source_capabilities import comments_forecast\n'
          new = 'from app.services.source_capabilities import comments_forecast\nfrom app.services.actor_input_contracts import validate_builtin_actor_input\n'
          assert old in text
          text = text.replace(old, new, 1)

          anchor = '''def news_queries_for_capacity(draft: AnalysisDraft, queries: list[str], target: int) -> list[str]:\n'''
          helpers = '''def _prioritized_source_queries(draft: AnalysisDraft, queries: list[str], limit: int) -> list[str]:\n    \"\"\"Prioritize explicit user focus without losing a bounded broad-topic recall route.\n\n    Limited-query Actors (especially Facebook) must not spend their few query slots on\n    generic market aliases before the user's actual event/focus terms.\n    \"\"\"\n    primary = canonical_topic(str(draft.topic or \"\").strip(), str(draft.market or \"\"))\n    primary_fold = primary.casefold()\n    focus_terms = uniq([*draft.keywords, *draft.additional_context])\n    focus_terms = [\n        str(x).strip() for x in focus_terms\n        if str(x).strip()\n        and str(x).strip().casefold() != primary_fold\n        and str(x).strip().casefold() not in primary_fold\n    ]\n    anchored = [f\"{primary} {term}\" for term in focus_terms]\n    ordered = []\n    if anchored:\n        ordered.append(anchored[0])\n    ordered.append(primary)\n    ordered.extend(anchored[1:])\n    ordered.extend(queries)\n    return uniq(ordered)[:max(1, int(limit))]\n\n\ndef _facebook_safe_query(value: str) -> str:\n    \"\"\"Facebook Posts Search documents a hard 100-character query limit.\"\"\"\n    value = re.sub(r\"\\s+\", \" \", str(value or \"\")).strip()\n    if len(value) <= 100:\n        return value\n    clipped = value[:100].rstrip()\n    if \" \" in clipped:\n        clipped = clipped.rsplit(\" \", 1)[0].rstrip()\n    return clipped or value[:100]\n\n\ndef _facebook_queries(draft: AnalysisDraft, queries: list[str], limit: int = 4) -> list[str]:\n    return uniq([_facebook_safe_query(q) for q in _prioritized_source_queries(draft, queries, limit) if q])[:limit]\n\n\ndef _tiktok_date_range(draft: AnalysisDraft, today: date | None = None) -> str:\n    \"\"\"Choose the narrowest documented TikTok relative window that still covers date_from.\"\"\"\n    today = today or date.today()\n    if draft.date_from > today:\n        return \"ALL_TIME\"\n    age = max(0, (today - draft.date_from).days)\n    if age <= 1:\n        return \"YESTERDAY\"\n    if draft.date_from.isocalendar()[:2] == today.isocalendar()[:2]:\n        return \"THIS_WEEK\"\n    if draft.date_from.year == today.year and draft.date_from.month == today.month:\n        return \"THIS_MONTH\"\n    if age <= 90:\n        return \"LAST_THREE_MONTHS\"\n    if age <= 180:\n        return \"LAST_SIX_MONTHS\"\n    return \"ALL_TIME\"\n\n\ndef _youtube_upload_date(draft: AnalysisDraft, today: date | None = None) -> str:\n    \"\"\"Map an exact requested range to YouTube's documented relative upload buckets.\"\"\"\n    today = today or date.today()\n    if draft.date_from > today:\n        return \"all\"\n    age = max(0, (today - draft.date_from).days)\n    if age <= 1:\n        return \"t\"\n    if age <= 7:\n        return \"w\"\n    if age <= 31:\n        return \"m\"\n    if age <= 366:\n        return \"y\"\n    return \"all\"\n\n\n'''
          assert anchor in text
          text = text.replace(anchor, helpers + anchor, 1)

          old = '''    elif source == \"tiktok\":\n        batches = batched(queries[:8] or [draft.topic], safe_batch)\n        shares = split_target(target, len(batches))\n        for i, (batch, share) in enumerate(zip(batches, shares)):\n            inp = {\"search\": batch, \"maxItems\": max(1, share), \"location\": \"GR\" if draft.market.casefold()==\"greece\" else None,\n                   \"dateRange\": \"ALL_TIME\", \"sortType\": \"RELEVANCE\"}\n'''
          new = '''    elif source == \"tiktok\":\n        source_queries = _prioritized_source_queries(draft, queries, 8)\n        batches = batched(source_queries or [draft.topic], safe_batch)\n        shares = split_target(target, len(batches))\n        for i, (batch, share) in enumerate(zip(batches, shares)):\n            inp = {\"search\": batch, \"maxItems\": max(1, share), \"location\": \"GR\" if draft.market.casefold()==\"greece\" else None,\n                   \"dateRange\": _tiktok_date_range(draft), \"sortType\": \"RELEVANCE\"}\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    elif source == \"facebook\":\n        q = queries[:4] or [draft.topic]\n'''
          new = '''    elif source == \"facebook\":\n        q = _facebook_queries(draft, queries, 4) or [_facebook_safe_query(draft.topic)]\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    elif source == \"youtube\":\n        batches = batched(queries[:10] or [draft.topic], safe_batch)\n        shares = split_target(target, len(batches))\n        for i, (batch, share) in enumerate(zip(batches, shares)):\n            inp = {\"keywords\": batch, \"gl\": \"gr\" if draft.market.casefold()==\"greece\" else \"us\",\n                   \"hl\": \"el\" if draft.market.casefold()==\"greece\" else \"en\", \"uploadDate\": \"all\", \"sort\": \"r\", \"maxItems\": max(1, share)}\n'''
          new = '''    elif source == \"youtube\":\n        source_queries = _prioritized_source_queries(draft, queries, 10)\n        batches = batched(source_queries or [draft.topic], safe_batch)\n        shares = split_target(target, len(batches))\n        for i, (batch, share) in enumerate(zip(batches, shares)):\n            inp = {\"keywords\": batch, \"gl\": \"gr\" if draft.market.casefold()==\"greece\" else \"us\",\n                   \"hl\": \"el\" if draft.market.casefold()==\"greece\" else \"en\", \"uploadDate\": _youtube_upload_date(draft), \"sort\": \"r\", \"maxItems\": max(1, share)}\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    elif source == \"news\":\n        news_queries = news_queries_for_capacity(draft, queries, target)\n'''
          new = '''    elif source == \"news\":\n        news_queries = news_queries_for_capacity(draft, _prioritized_source_queries(draft, queries, 8), target)\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    plans = [make_source_plan(s, targets[s], draft, queries, registry, max(0.0, source_budgets[s])) for s in selected]\n    estimated = None if has_unknown else round(known_total, 4)\n'''
          new = '''    plans = [make_source_plan(s, targets[s], draft, queries, registry, max(0.0, source_budgets[s])) for s in selected]\n    # Validate the exact built-in Actor payloads before a run can ever reach a paid call.\n    # This is intentionally source-specific because every Apify Actor has a different input contract.\n    for source_plan in plans:\n        for subrun in source_plan.subruns:\n            validate_builtin_actor_input(source_plan.source, subrun.actor_id, subrun.input)\n    estimated = None if has_unknown else round(known_total, 4)\n'''
          assert old in text
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          cat > app/services/actor_input_contracts.py <<'PY'
          from __future__ import annotations

          import re
          from datetime import date


          BUILTIN_ACTOR_IDS = {
              "x": "xquik/x-tweet-scraper",
              "tiktok": "epctex/tiktok-search-scraper",
              "instagram": "apify/instagram-scraper",
              "facebook": "scraper_one/facebook-posts-search",
              "youtube": "apidojo/youtube-scraper",
              "news": "logiover/google-news-scraper",
          }

          TIKTOK_DATE_RANGES = {
              "DEFAULT", "ALL_TIME", "YESTERDAY", "THIS_WEEK", "THIS_MONTH",
              "LAST_THREE_MONTHS", "LAST_SIX_MONTHS",
          }
          TIKTOK_SORT_TYPES = {"RELEVANCE", "MOST_LIKED", "DATE_POSTED"}
          YOUTUBE_UPLOAD_DATES = {"all", "l", "t", "w", "m", "y"}
          YOUTUBE_SORTS = {"r", "ra", "u", "v"}
          X_QUERY_TYPES = {"Latest", "Top", "Latest + Top"}


          def _fail(source: str, message: str) -> None:
              raise ValueError(f"{source} Actor input contract error: {message}")


          def _positive_int(source: str, payload: dict, key: str, *, maximum: int | None = None) -> int:
              value = payload.get(key)
              if isinstance(value, bool) or not isinstance(value, int) or value < 1:
                  _fail(source, f"{key} must be an integer >= 1")
              if maximum is not None and value > maximum:
                  _fail(source, f"{key} must be <= {maximum}")
              return value


          def _string_list(source: str, payload: dict, key: str) -> list[str]:
              value = payload.get(key)
              if not isinstance(value, list) or not value or any(not isinstance(x, str) or not x.strip() for x in value):
                  _fail(source, f"{key} must be a non-empty array of strings")
              return value


          def _iso_date(source: str, payload: dict, key: str) -> None:
              value = payload.get(key)
              if value in (None, ""):
                  return
              if not isinstance(value, str):
                  _fail(source, f"{key} must be an ISO date string")
              try:
                  date.fromisoformat(value[:10])
              except Exception:
                  _fail(source, f"{key} must begin with YYYY-MM-DD")


          def validate_builtin_actor_input(source: str, actor_id: str, payload: dict) -> None:
              """Validate only the built-in Actor fields SIGNALYTH actually sends.

              Custom/replacement Actors are governed by their persisted schema mapping instead.
              These contracts mirror the current public Apify schemas for the six shipped Actors
              and deliberately fail before a paid call when a field/type/enum drifts.
              """
              if BUILTIN_ACTOR_IDS.get(source) != actor_id:
                  return
              if not isinstance(payload, dict):
                  _fail(source, "payload must be an object")

              if source == "x":
                  if payload.get("mode") != "search":
                      _fail(source, "mode must be search")
                  _string_list(source, payload, "searchTerms")
                  _positive_int(source, payload, "maxItems")
                  _positive_int(source, payload, "maxItemsPerTarget")
                  if payload.get("queryType") not in X_QUERY_TYPES:
                      _fail(source, "queryType is not a documented Xquik value")
                  for key in ("since", "until"):
                      value = payload.get(key)
                      if not isinstance(value, str) or not re.fullmatch(r"\d{4}-\d{2}-\d{2}_\d{2}:\d{2}:\d{2}_UTC", value):
                          _fail(source, f"{key} must use YYYY-MM-DD_HH:MM:SS_UTC")
                  if payload.get("includeSearchTerms") is not True:
                      _fail(source, "includeSearchTerms must be true for auditability")
                  return

              if source == "tiktok":
                  _string_list(source, payload, "search")
                  _positive_int(source, payload, "maxItems")
                  if payload.get("dateRange") not in TIKTOK_DATE_RANGES:
                      _fail(source, "dateRange is not documented by the TikTok Actor")
                  if payload.get("sortType") not in TIKTOK_SORT_TYPES:
                      _fail(source, "sortType is not documented by the TikTok Actor")
                  location = payload.get("location")
                  if location is not None and (not isinstance(location, str) or not re.fullmatch(r"[A-Z]{2}", location)):
                      _fail(source, "location must be an ISO alpha-2 country code")
                  return

              if source == "instagram":
                  urls = _string_list(source, payload, "directUrls")
                  if any(not u.startswith("https://www.instagram.com/") for u in urls):
                      _fail(source, "directUrls must contain Instagram URLs")
                  if payload.get("resultsType") not in {"posts", "reels"}:
                      _fail(source, "resultsType must be posts or reels for discovery")
                  _positive_int(source, payload, "resultsLimit")
                  _iso_date(source, payload, "onlyPostsNewerThan")
                  if payload.get("addParentData") is not True:
                      _fail(source, "addParentData must be true for source context")
                  return

              if source == "facebook":
                  query = payload.get("query")
                  if not isinstance(query, str) or not (1 <= len(query.strip()) <= 100):
                      _fail(source, "query must be a 1-100 character string")
                  _positive_int(source, payload, "resultsCount")
                  if payload.get("searchType") not in {"top", "latest"}:
                      _fail(source, "searchType must be top or latest")
                  _iso_date(source, payload, "startDate")
                  _iso_date(source, payload, "endDate")
                  return

              if source == "youtube":
                  _string_list(source, payload, "keywords")
                  _positive_int(source, payload, "maxItems")
                  if payload.get("uploadDate") not in YOUTUBE_UPLOAD_DATES:
                      _fail(source, "uploadDate is not a documented YouTube Actor value")
                  if payload.get("sort") not in YOUTUBE_SORTS:
                      _fail(source, "sort is not a documented YouTube Actor value")
                  if not isinstance(payload.get("gl"), str) or not payload.get("gl"):
                      _fail(source, "gl must be a country code")
                  if not isinstance(payload.get("hl"), str) or not payload.get("hl"):
                      _fail(source, "hl must be a language code")
                  return

              if source == "news":
                  _string_list(source, payload, "queries")
                  _positive_int(source, payload, "maxArticles", maximum=500)
                  if not isinstance(payload.get("language"), str) or not payload.get("language"):
                      _fail(source, "language must be set")
                  if not isinstance(payload.get("country"), str) or not re.fullmatch(r"[A-Z]{2}", payload.get("country")):
                      _fail(source, "country must be a 2-letter uppercase code")
                  _iso_date(source, payload, "fromDate")
                  _iso_date(source, payload, "toDate")
                  if payload.get("resolveUrls") is not True:
                      _fail(source, "resolveUrls must be true")
          PY

          cat > tests/test_actor_input_contracts_v185.py <<'PY'
          import unittest
          from datetime import date, timedelta

          from app.models import AnalysisDraft
          from app.services.actor_input_contracts import validate_builtin_actor_input
          from app.services.query_planner import build_collection_plan


          class ActorInputContractsV185Tests(unittest.TestCase):
              def _plan(self):
                  today = date.today()
                  draft = AnalysisDraft(
                      client="TEST",
                      topic="Αλέξης Τσίπρας",
                      market="Greece",
                      date_from=today - timedelta(days=6),
                      date_to=today,
                      keywords=["ΔΕΘ", "Θεσσαλονίκη", "οικονομία"],
                      sources=["x", "tiktok", "instagram", "facebook", "youtube", "news"],
                      sample_mode="automatic",
                      sample_target=300,
                      comments=False,
                      max_budget_usd=2.0,
                      smart_search=True,
                      report_language="Ελληνικά",
                  )
                  return build_collection_plan(draft)

              def test_all_six_builtin_payloads_validate_without_network(self):
                  plan = self._plan()
                  self.assertEqual({p.source for p in plan.sources}, {"x", "tiktok", "instagram", "facebook", "youtube", "news"})
                  for source_plan in plan.sources:
                      self.assertTrue(source_plan.subruns)
                      for subrun in source_plan.subruns:
                          validate_builtin_actor_input(source_plan.source, subrun.actor_id, subrun.input)

              def test_focus_terms_are_not_pushed_out_of_facebook_slots(self):
                  plan = self._plan()
                  facebook = next(p for p in plan.sources if p.source == "facebook")
                  queries = [s.input["query"] for s in facebook.subruns]
                  self.assertTrue(any("ΔΕΘ" in q for q in queries), queries)
                  self.assertTrue(any("Αλέξης Τσίπρας" in q for q in queries), queries)
                  self.assertTrue(all(1 <= len(q) <= 100 for q in queries), queries)

              def test_recent_period_uses_native_relative_filters_before_exact_post_filter(self):
                  plan = self._plan()
                  tiktok = next(p for p in plan.sources if p.source == "tiktok")
                  youtube = next(p for p in plan.sources if p.source == "youtube")
                  self.assertTrue(all(s.input["dateRange"] != "ALL_TIME" for s in tiktok.subruns))
                  self.assertTrue(all(s.input["uploadDate"] == "w" for s in youtube.subruns))
                  self.assertTrue(all(s.exact_post_filter for s in tiktok.subruns))
                  self.assertTrue(all(s.exact_post_filter for s in youtube.subruns))

              def test_each_source_uses_its_documented_search_field_shape(self):
                  plan = self._plan()
                  by_source = {p.source: p for p in plan.sources}
                  self.assertIsInstance(by_source["x"].subruns[0].input["searchTerms"], list)
                  self.assertIsInstance(by_source["tiktok"].subruns[0].input["search"], list)
                  self.assertIsInstance(by_source["instagram"].subruns[0].input["directUrls"], list)
                  self.assertIsInstance(by_source["facebook"].subruns[0].input["query"], str)
                  self.assertIsInstance(by_source["youtube"].subruns[0].input["keywords"], list)
                  self.assertIsInstance(by_source["news"].subruns[0].input["queries"], list)


          if __name__ == "__main__":
              unittest.main()
          PY

      - name: Install and run contract tests
        run: |
          python -m pip install -q -e .
          python -m compileall -q app
          python -m unittest tests.test_actor_input_contracts_v185

      - name: Commit tested patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/harden-actor-input-contracts.yml
          git add app/services/query_planner.py app/services/actor_input_contracts.py tests/test_actor_input_contracts_v185.py
          git commit -m "Harden source-specific Apify query inputs"
          git push
