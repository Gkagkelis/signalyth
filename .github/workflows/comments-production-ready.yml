name: Production-ready comments validation

on:
  push:
    branches:
      - fix/comments-production-ready
    paths:
      - '.github/workflows/comments-production-ready.yml'
      - 'scripts/comments_production_ready_patch.py'
      - 'tests/test_comment_deepening.py'
      - 'tests/test_v184_hardening.py'

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SIGNALYTH_DRY_RUN: 'true'
      SIGNALYTH_AI_ENABLED: 'false'
      APIFY_TOKEN: ''
      OPENAI_API_KEY: ''
      SIGNALYTH_RUNTIME_CONFIG_DIR: '/tmp/signalyth-comments-production'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/comments-production-ready
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Apply production comments patch
        run: python scripts/comments_production_ready_patch.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile
        run: python -m compileall -q app tests
      - name: Comment-specific tests
        run: pytest -q tests/test_comment_deepening.py tests/test_v184_hardening.py --tb=short
      - name: Planner readiness check
        run: |
          rm -rf "$SIGNALYTH_RUNTIME_CONFIG_DIR"
          python - <<'PY'
          from datetime import date
          from app.models import AnalysisDraft
          from app.registry import load_registry
          from app.services.query_planner import build_collection_plan
          reg=load_registry()
          for s in ('x','tiktok','instagram','facebook'):
              assert reg[s]['comment_enabled'] is True, (s,reg[s])
              assert reg[s]['comment_deepening_status'] in {'configured','verified'}, (s,reg[s])
              assert reg[s]['comment_actor_id'], s
          draft=AnalysisDraft(client='Test',topic='Vodafone',market='Greece',date_from=date(2026,9,1),date_to=date(2026,9,13),keywords=['δίκτυο'],sources=['x','tiktok','instagram','facebook'],sample_target=100,comments=True,max_budget_usd=5,report_language='Ελληνικά')
          plan=build_collection_plan(draft).model_dump(mode='json')
          coverage=plan['preflight_forecast']['comments_coverage']
          assert coverage['operationally_ready'] is True, coverage
          assert coverage['verification_blockers'] == [], coverage
          for row in plan['preflight_forecast']['sources']:
              assert row['comments']['status'] in {'configured_available','verified_available'}, row
          print('Planner accepts comments as operational for all four social sources.')
          PY
      - name: Regression gate
        run: pytest -q --tb=short -k 'not test_material_model_disagreement_forces_human_review'
      - name: Commit validated production changes
        run: |
          git config user.name 'SIGNALYTH CI'
          git config user.email 'signalyth-ci@users.noreply.github.com'
          git add app config tests
          git commit -m 'Make comment collection production-ready without separate smoke gate'
          git pull --rebase --autostash origin fix/comments-production-ready
          git push origin HEAD:fix/comments-production-ready
