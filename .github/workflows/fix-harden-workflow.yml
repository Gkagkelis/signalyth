name: Fix Actor contract test workflow

on:
  push:
    paths:
      - '.github/workflows/fix-harden-workflow.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix test dependency setup
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/harden-actor-input-contracts.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          python -m pip install -q -e .
          python -m compileall -q app
          python -m unittest tests.test_actor_input_contracts_v185
'''
          new = '''          python -m pip install -q "pydantic>=2.13,<3" "pydantic-settings>=2.12,<3"
          python -m compileall -q app
          python -m unittest discover -s tests -p 'test_actor_input_contracts_v185.py' -v
'''
          if old not in text:
              raise SystemExit('Expected test block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fix and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-harden-workflow.yml
          git add .github/workflows/harden-actor-input-contracts.yml
          git commit -m "Fix Actor contract test dependency setup"
          git push
