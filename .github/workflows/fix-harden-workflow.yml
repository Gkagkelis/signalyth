name: Fix Actor contract test workflow

on:
  push:
    paths:
      - '.github/workflows/fix-harden-workflow.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix test dependency setup
        run: |
          sed -i 's#python -m pip install -q -e \.#python -m pip install -q "pydantic>=2.13,<3" "pydantic-settings>=2.12,<3"#' .github/workflows/harden-actor-input-contracts.yml
          sed -i "s#python -m unittest tests.test_actor_input_contracts_v185#python -m unittest discover -s tests -p 'test_actor_input_contracts_v185.py' -v#" .github/workflows/harden-actor-input-contracts.yml

      - name: Commit fix and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-harden-workflow.yml
          git add .github/workflows/harden-actor-input-contracts.yml
          git commit -m "Fix Actor contract test dependency setup"
          git push
