name: Unpack SIGNALYTH

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack SIGNALYTH package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="SIGNALYTH-v1.8.4-VERCEL-READY.zip"
          if [ ! -f "$ZIP" ]; then
            echo "Package already unpacked; nothing to do."
            exit 0
          fi
          TMP_DIR="$(mktemp -d)"
          unzip -q "$ZIP" -d "$TMP_DIR"
          ROOT="$(find "$TMP_DIR" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [ -z "$ROOT" ]; then
            echo "Could not find package root" >&2
            exit 1
          fi
          cp -a "$ROOT"/. ./
          rm -f .env
          rm -f "$ZIP"
          rm -f .github/workflows/unpack-signalyth.yml

      - name: Commit unpacked app
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Unpack SIGNALYTH Vercel-ready application"
          git push origin main
