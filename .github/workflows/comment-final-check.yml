name: Comment final branch check

on:
  push:
    branches:
      - feat/comment-deepening-v1
    paths:
      - '.github/workflows/comment-final-check.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SIGNALYTH_DRY_RUN: 'true'
      SIGNALYTH_AI_ENABLED: 'false'
      APIFY_TOKEN: ''
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile
        run: python -m compileall -q app tests
      - name: Comment tests
        run: pytest -q tests/test_comment_deepening.py --tb=short
      - name: Regression gate
        run: pytest -q --tb=short -k 'not test_material_model_disagreement_forces_human_review'
