name: v30.2 validation

on:
  push:
    branches:
      - fix/v30-2-comment-conversation
      - fix/facebook-comment-harvest-now
      - fix/v31-systemic-acquisition-contracts
    paths:
      - 'app/services/relevance_expansion.py'
      - 'app/services/source_capabilities.py'
      - 'app/services/collector.py'
      - 'app/templates/index.html'
      - 'tests/test_v30_2_comment_conversation.py'
      - 'tests/test_comment_deepening.py'
      - 'tests/test_v30_conversation_acquisition.py'
      - 'app/services/comment_deepening.py'
      - 'app/services/cleaning.py'
      - 'app/services/query_planner.py'
      - 'app/services/resilience.py'
      - 'app/main.py'
      - 'tests/test_conversation_context_v29.py'
      - 'tests/test_v31_acquisition_contracts.py'
      - 'tests/test_master30_contract.py'
      - 'tests/test_owned_pages_flow_v19.py'
      - 'tests/test_relevance_expansion_v2.py'
      - 'tests/test_smart_collection_v2.py'
      - 'tests/test_v184_hardening.py'
      - 'tests/test_worker_handoff_v20.py'
      - 'tests/test_cold_handoff_v21.py'
      - 'config/source_registry.json'
      - 'app/registry.py'
      - '.github/workflows/v30-2-validation.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SIGNALYTH_DRY_RUN: 'true'
      SIGNALYTH_AI_ENABLED: 'false'
      APIFY_TOKEN: ''
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile
        run: python -m compileall -q app tests
      - name: v30.2 focused regression
        run: pytest -q tests/test_v30_2_comment_conversation.py
      - name: Full regression suite
        run: pytest -q --tb=short